<!DOCTYPE html>
<html lang="sq">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StarCine - Login</title>
        <link rel="icon" href="">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/auth.css">
        <script src="js/main.js" defer></script>
        <script src="js/password.js" defer></script>
    </head>
    <body>
        <header class="header">
            <a href="index.html" class="logo">
                <img src="" alt="logo">
                StarCine
            </a>
            <nav>
                <ul class="menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="filmat.html">Filmat</a></li>
                    <li><a href="oraret.html">Oraret</a></li>
                    <li><a href="rezervimi.html">Rezervimi</a></li>
                    <li><a href="login.html" class="active">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </nav>
        </header>

    </header>

    <main class="auth">
        <aside class="auth-left">
            <img src="" alt="Kokoshka">
            <p>Mire se vini serish!</p>
        </aside>

        <section class="auth-box">
          <h1>Hyr ne llogarin tende</h1>

          <form action="#" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Fjalekalimi</label>
            <div class="password-box">
                <input type="password" id="password" name="password" required>
                <button type="button" class="show-btn"></button>
            </div>

            <label class="check">
                <input type="checkbox" name="remember">Me mbaj te kyqur
            </label>

            <button type="submit" class="btn full">Hyr</button>
            <p class="note">Nuk ke llogari? <a href="register.html"></a></p>
          </form>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 StarCine. Te gjitha te drejtat e rezervuara.</p>
        <div>
            <a href="#">Fcebook</a>
            <a href="#">Instagram</a>
            <a href="#">YouTube</a>
        </div>
    </footer>
</body>
</html>
